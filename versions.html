<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>GFC 페이지 버전 목록</title><style>body{font-family:system-ui,sans-serif;background:#f6f5ef;color:#152e2b;max-width:850px;margin:70px auto;padding:24px;line-height:1.8}h1{font-size:36px}a{color:#185c4e}article{border-top:1px solid #bbcaba;padding:22px 0}small{color:#596d67}.badge{font-size:12px;background:#e3eadd;padding:4px 8px;border-radius:4px}</style><p>GFC CAREER GUIDE / ARCHIVE</p><h1>페이지 버전 모아보기</h1><p>날짜와 버전별 페이지를 보존합니다. ‘최신’은 가장 최근 제작본이며 공개 승인 상태를 뜻하지 않습니다.</p><div id="versions"><article><span class="badge">최신 · 검토용 초안</span><h2><a href="gfc-2026-11-13-v3.html">2026-11-13 · v3 · 삼성생명 GFC · 블루 커리어 안내형</a></h2></article><article><span class="badge">보존본 · 검토용 초안</span><h2><a href="gfc-2026-11-13-v2.html">2026-11-13 · v2 · 시네마틱 비주얼 · 네이비 대화형</a></h2></article><article><span class="badge">보존본 · 검토용 초안</span><h2><a href="gfc-2026-11-13-v1.html">2026-11-13 · v1 · 경력의 다음 역할</a></h2></article></div><p><a href="index.html">최신 페이지로 돌아가기 ↗</a></p><script>fetch('versions.json').then(r=>{if(!r.ok)throw Error('목록 오류');return r.json()}).then(data=>{const box=document.getElementById('versions');box.replaceChildren();for(const v of data.versions){const a=document.createElement('article'),link=document.createElement('a'),h=document.createElement('h2'),s=document.createElement('small');link.href=v.path;link.textContent=v.date+' · '+v.version+' · '+v.title;s.textContent=(v.id===data.latest?'최신 · ':'')+(v.status==='draft'?'검토용 초안':v.status);h.append(link);a.append(s,h);box.append(a)}}).catch(()=>{});</script></html>
